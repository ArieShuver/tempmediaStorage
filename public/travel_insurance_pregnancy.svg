<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Travel insurance during pregnancy</title>
  <desc id="desc">A calm illustrated travel scene with a pregnant traveler, passport, suitcase and airplane.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff4f4"/>
      <stop offset="0.58" stop-color="#b7dce4"/>
      <stop offset="1" stop-color="#8bc3d2"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
